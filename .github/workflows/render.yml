name: render-shorts
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: render-shorts
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q numpy pillow
      - name: Surekli uretim
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sSL -o jobs.csv "https://docs.google.com/spreadsheets/d/1Vkgia9Ci3Xsy5kCHtowOgYCPZkv_5NrEFMj0i9zKy04/export?format=csv&gid=1887033884"
          python3 -c "import csv;r=list(csv.reader(open('jobs.csv',encoding='utf-8')));open('runner.py','w',encoding='utf-8').write(r[0][3])"
          python3 runner.py
      - name: Sonraki turu baslat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run render.yml --ref main || true
